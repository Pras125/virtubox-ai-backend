<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>VirtuBox Sales Copilot</title>
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1115; --panel:#16181d; --panel2:#1d2027; --line:#2a2e37; --text:#e8eaf0; --muted:#9aa1ad;
  --accent:#ff6a2b; --accent2:#ff8a50; --ok:#22c55e; --user:#262a33; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;overflow:hidden;font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
a{color:var(--accent2)}
.hidden{display:none!important}

/* login */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#2a1a12 0%,var(--bg) 60%);z-index:50}
.login-card{width:min(380px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px 28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#ffb36b);display:grid;place-items:center;font-weight:800;color:#1b0d05}
.login-card p{color:var(--muted);margin:8px 0 22px;font-size:14px}
.field{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;outline:none}
.field:focus{border-color:var(--accent)}
.btn{background:var(--accent);color:#1b0d05;font-weight:600;border-radius:10px;padding:12px 16px;width:100%}
.btn:hover{background:var(--accent2)}
.err{color:#f87171;font-size:13px;min-height:18px;margin-top:8px}

/* sidebar */
#sidebar{width:270px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:transform .2s}
.side-top{padding:14px 12px 8px;display:flex;flex-direction:column;gap:10px}
.new-chat{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:500}
.new-chat:hover{background:var(--panel2)}
.search{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none;font-size:14px}
#chatList{flex:1;overflow-y:auto;padding:4px 8px 12px}
.group-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 8px 6px}
.chat-item{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:9px;font-size:14px;color:#cfd3db;cursor:pointer}
.chat-item:hover{background:var(--panel2)}
.chat-item.active{background:var(--user);color:#fff}
.chat-item .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .act{opacity:0;font-size:13px;color:var(--muted);padding:2px 4px;border-radius:5px}
.chat-item:hover .act{opacity:1}
.chat-item .act:hover{color:#fff;background:var(--line)}
.side-bottom{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.side-link{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:8px;color:#cfd3db;text-align:left}
.side-link:hover{background:var(--panel2)}
.me{color:var(--muted);padding:4px 8px;display:flex;justify-content:space-between;align-items:center}

/* main */
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.topbar{height:54px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}
.topbar .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#menuBtn{display:none;font-size:20px;padding:4px 8px}
.mode{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px;font-size:12.5px}
.mode button{padding:5px 11px;border-radius:999px;color:var(--muted)}
.mode button.on{background:var(--accent);color:#1b0d05;font-weight:600}

#scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
.thread{max-width:820px;margin:0 auto;padding:24px 18px 30px}
.msg{display:flex;gap:14px;margin:0 0 26px}
.msg.user{justify-content:flex-end}
.msg.user .bubble{background:var(--user);border-radius:18px 18px 4px 18px;padding:11px 16px;max-width:80%;white-space:pre-wrap;word-wrap:break-word}
.avatar{width:30px;height:30px;border-radius:9px;flex-shrink:0;background:linear-gradient(135deg,var(--accent),#ffb36b);display:grid;place-items:center;font-weight:800;font-size:13px;color:#1b0d05}
.msg.bot .body{flex:1;min-width:0}
.md{line-height:1.65}
.md p{margin:0 0 10px}
.md ul,.md ol{margin:0 0 10px 22px}
.md li{margin:3px 0}
.md h1,.md h2,.md h3{margin:16px 0 8px;font-size:1.05em}
.md strong{color:#fff}
.md code{background:var(--panel2);padding:2px 6px;border-radius:5px;font-size:.9em}
.md pre{background:#0a0b0e;border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;margin:0 0 10px}
.md pre code{background:none;padding:0}
.md table{border-collapse:collapse;margin:6px 0 12px;font-size:14px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:7px 10px;text-align:left}
.md th{background:var(--panel2)}
.md blockquote{border-left:3px solid var(--accent);padding-left:12px;color:#cfd3db;margin:0 0 10px}
.cursor::after{content:"▋";color:var(--accent);animation:blink 1s steps(2) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.thinking{display:flex;gap:5px;padding:8px 0}
.thinking span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite}
.thinking span:nth-child(2){animation-delay:.15s}.thinking span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.sources{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.src{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:#cfd3db;text-decoration:none;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src:hover{border-color:var(--accent)}
.src b{color:var(--accent2);font-weight:600;margin-right:4px}
.tools{display:flex;gap:4px;margin-top:8px}
.tools button{font-size:12.5px;color:var(--muted);padding:5px 9px;border-radius:7px}
.tools button:hover{background:var(--panel2);color:#fff}
.error-msg{color:#fca5a5;background:#2a1414;border:1px solid #4b1d1d;border-radius:10px;padding:10px 14px}

/* empty state */
.hero{max-width:820px;margin:0 auto;padding:9vh 18px 20px;text-align:center}
.hero h1{font-size:28px;font-weight:700;margin:14px 0 6px}
.hero p{color:var(--muted)}
.hero .logo{width:52px;height:52px;font-size:22px;margin:0 auto;border-radius:14px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:28px;text-align:left}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:14px;line-height:1.4}
.chip:hover{border-color:var(--accent);background:var(--panel2)}
.chip .k{display:block;font-weight:600;color:#fff;margin-bottom:3px}
.chip .d{color:var(--muted);font-size:13px}

/* composer */
.composer-wrap{padding:10px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.composer{max-width:820px;margin:0 auto;background:var(--panel2);border:1px solid var(--line);border-radius:18px;display:flex;align-items:flex-end;gap:6px;padding:8px 8px 8px 16px}
.composer:focus-within{border-color:#3a3f4a}
#input{flex:1;background:none;border:0;outline:none;resize:none;max-height:200px;padding:8px 0;line-height:1.5}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.icon-btn:hover{background:var(--line);color:#fff}
#sendBtn{background:var(--accent);color:#1b0d05}
#sendBtn:disabled{background:var(--line);color:var(--muted);cursor:default}
#micBtn.rec{color:#f87171;animation:blink 1s infinite}
.hint{max-width:820px;margin:6px auto 0;text-align:center;color:var(--muted);font-size:11.5px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(620px,100%);max-height:85vh;display:flex;flex-direction:column}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);font-weight:600}
.modal .content{padding:16px 18px;overflow-y:auto;font-size:14px}
.lib-item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lib-item:last-child{border:0}
.lib-item span{color:var(--muted);font-size:12px}
.stat{display:inline-block;background:var(--panel2);border-radius:8px;padding:6px 10px;margin:0 6px 6px 0;font-size:13px}
.log{background:#0a0b0e;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,monospace;font-size:12px;max-height:260px;overflow:auto;white-space:pre-wrap;margin-top:10px}
.btn-sm{background:var(--accent);color:#1b0d05;font-weight:600;border-radius:8px;padding:7px 12px;font-size:13px;margin:0 6px 6px 0}

@media (max-width:820px){
  #sidebar{position:fixed;inset:0 auto 0 0;z-index:30;transform:translateX(-100%)}
  #sidebar.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
  #menuBtn{display:block}
  .hero{padding-top:5vh}.hero h1{font-size:22px}
  .msg.user .bubble{max-width:90%}
  .mode button{padding:5px 8px}
}
</style>
</head>
<body>

<aside id="sidebar">
  <div class="side-top">
    <div class="brand" style="padding:4px 4px 6px"><div class="logo">V</div>Sales Copilot</div>
    <button class="new-chat" id="newChat">＋ New chat</button>
    <input class="search" id="search" placeholder="Search chats…">
  </div>
  <div id="chatList"></div>
  <div class="side-bottom">
    <button class="side-link" id="libBtn">📚 Sales library</button>
    <button class="side-link hidden" id="adminBtn">⚙️ Refresh knowledge</button>
  </div>
</aside>

<main id="main">
  <div class="topbar">
    <button id="menuBtn" aria-label="Menu">☰</button>
    <div class="title" id="chatTitle">New chat</div>
    <div class="mode" title="Meeting mode gives short answers you can read out loud">
      <button data-style="quick" class="on">⚡ Meeting</button>
      <button data-style="detailed">📄 Detailed</button>
    </div>
  </div>

  <div id="scroll">
    <div id="hero" class="hero">
      <div class="logo">V</div>
      <h1>What do you need for this client?</h1>
      <p>Ask about any VirtuBox product, use case, deployment or objection — answers come from the docs, website and sales one-pagers.</p>
      <div class="chips" id="chips"></div>
    </div>
    <div class="thread" id="thread"></div>
  </div>

  <div class="composer-wrap">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Ask anything about VirtuBox…"></textarea>
      <button class="icon-btn" id="micBtn" title="Speak (Hindi/English)">🎤</button>
      <button class="icon-btn" id="sendBtn" title="Send" disabled>➤</button>
    </div>
    <div class="hint">Enter to send · Shift+Enter for new line · Always confirm pricing &amp; timelines with the product team</div>
  </div>
</main>

<div id="modal" class="modal-bg hidden">
  <div class="modal">
    <header><span id="modalTitle"></span><button id="modalClose" style="font-size:18px">✕</button></header>
    <div class="content" id="modalBody"></div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const state = { user: null, admin: false, chats: [], current: null, style: localStorage.getItem('vb_style') || 'quick', busy: false, controller: null };

const QUICK = [
  { k: 'Elevator pitch', d: 'VirtuBox in 30 seconds', q: 'Give me a 30-second elevator pitch for VirtuBox I can say to a new client.' },
  { k: 'Fit for an industry', d: 'Map VirtuBox to the client', q: 'The client is a government office. Which VirtuBox solutions fit, and what deployments can I mention?' },
  { k: 'Government kiosks', d: 'CGST & Customs one-pagers', q: 'Summarise our CGST Digital Kiosk and Customs Self-Declaration Kiosk deployments — what problem did each solve and what are the key features?' },
  { k: 'Handle an objection', d: '"We already have a website"', q: 'Client says: "We already have a website and an app, why do we need a kiosk?" How should I respond?' },
  { k: 'Kiosk vs signage', d: 'Explain the difference', q: 'Explain the difference between VirtuKiosk and VirtuSignage in simple words, with an example for a retail store.' },
  { k: 'Follow-up email', d: 'Draft after the meeting', q: 'Draft a short follow-up email after a meeting with a museum client interested in a ticketing and information kiosk.' },
  { k: 'Discovery questions', d: 'What to ask the client', q: 'Give me 8 discovery questions to ask a client before proposing a VirtuBox kiosk solution.' },
  { k: 'IT team questions', d: 'Offline mode, admin, hardware', q: 'The client IT team asks: does the kiosk work offline, how is content updated, and who manages it? Answer for them.' },
];

// ───────── API ─────────
async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}

async function boot() {
  const me = await api('/api/me');
  state.admin = me.admin;
  $('#adminBtn').classList.toggle('hidden', !me.admin);
  await loadChats();
  const id = location.hash.slice(1);
  if (id && state.chats.some((c) => c.id === id)) openChat(id); else newChat();
}

// ───────── Sidebar ─────────
async function loadChats() { state.chats = await api('/api/chats'); renderChatList(); }
function renderChatList() {
  const term = $('#search').value.trim().toLowerCase();
  const list = state.chats.filter((c) => !term || c.title.toLowerCase().includes(term));
  const now = Date.now(), day = 864e5;
  const groups = [['Pinned', (c) => c.pinned], ['Today', (c) => now - c.updatedAt < day], ['Last 7 days', (c) => now - c.updatedAt < 7 * day], ['Older', () => true]];
  const used = new Set();
  let html = '';
  for (const [label, fn] of groups) {
    const items = list.filter((c) => !used.has(c.id) && fn(c));
    if (!items.length) continue;
    items.forEach((c) => used.add(c.id));
    html += `<div class="group-label">${label}</div>` + items.map((c) => `
      <div class="chat-item ${state.current === c.id ? 'active' : ''}" data-id="${c.id}">
        <span class="t">${esc(c.title)}</span>
        <button class="act" data-act="pin" title="${c.pinned ? 'Unpin' : 'Pin'}">${c.pinned ? '★' : '☆'}</button>
        <button class="act" data-act="rename" title="Rename">✎</button>
        <button class="act" data-act="del" title="Delete">🗑</button>
      </div>`).join('');
  }
  $('#chatList').innerHTML = html || '<div class="group-label">No chats yet</div>';
}
$('#search').oninput = renderChatList;
$('#chatList').onclick = async (e) => {
  const item = e.target.closest('.chat-item'); if (!item) return;
  const id = item.dataset.id, act = e.target.dataset.act;
  const c = state.chats.find((x) => x.id === id);
  if (act === 'del') {
    if (!confirm('Delete this chat?')) return;
    await api(`/api/chats/${id}`, { method: 'DELETE' });
    if (state.current === id) newChat();
    return loadChats();
  }
  if (act === 'rename') {
    const t = prompt('Rename chat', c.title); if (!t) return;
    await api(`/api/chats/${id}`, { method: 'PATCH', body: { title: t } }); return loadChats();
  }
  if (act === 'pin') { await api(`/api/chats/${id}`, { method: 'PATCH', body: { pinned: !c.pinned } }); return loadChats(); }
  openChat(id);
};
$('#newChat').onclick = () => newChat();
$('#menuBtn').onclick = (e) => { e.stopPropagation(); $('#sidebar').classList.toggle('open'); };
document.addEventListener('click', (e) => { if (!e.target.closest('#sidebar')) $('#sidebar').classList.remove('open'); });

function newChat() {
  stopStream();
  state.current = null; location.hash = '';
  $('#thread').innerHTML = ''; $('#hero').classList.remove('hidden');
  $('#chatTitle').textContent = 'New chat';
  renderChatList(); $('#sidebar').classList.remove('open'); $('#input').focus();
}
async function openChat(id) {
  stopStream();
  const c = await api(`/api/chats/${id}`);
  state.current = id; location.hash = id;
  $('#chatTitle').textContent = c.title;
  $('#hero').classList.add('hidden');
  $('#thread').innerHTML = '';
  c.messages.forEach((m) => m.role === 'user' ? addUser(m.content) : addBot(m.content, m.sources));
  renderChatList(); $('#sidebar').classList.remove('open');
  scrollEnd(false);
}

// ───────── Messages ─────────
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function md(s) { return DOMPurify.sanitize(marked.parse(s || '', { breaks: true, gfm: true }), { ADD_ATTR: ['target'] }); }
function addUser(text) {
  const el = document.createElement('div'); el.className = 'msg user';
  el.innerHTML = `<div class="bubble">${esc(text)}</div>`;
  $('#thread').appendChild(el);
}
function addBot(text, sources) {
  const el = document.createElement('div'); el.className = 'msg bot';
  el.innerHTML = `<div class="avatar">V</div><div class="body"><div class="md"></div><div class="sources"></div><div class="tools"></div></div>`;
  $('#thread').appendChild(el);
  if (text != null) finishBot(el, text, sources);
  return el;
}
const SRC_LABEL = { drive: 'One-pager', local: 'Sales file', docs: 'Docs', website: 'Web' };
function renderSources(el, sources) {
  const box = el.querySelector('.sources');
  box.innerHTML = (sources || []).slice(0, 6).map((s) => {
    const href = s.url.startsWith('local://') ? '#' : s.url;
    return `<a class="src" href="${esc(href)}" target="_blank" rel="noopener" title="${esc(s.title)}"><b>${SRC_LABEL[s.source] || 'Source'}</b>${esc(s.title)}</a>`;
  }).join('');
}
function finishBot(el, text, sources) {
  el.querySelector('.md').classList.remove('cursor');
  el.querySelector('.md').innerHTML = md(text);
  el.querySelectorAll('.md a').forEach((a) => { a.target = '_blank'; a.rel = 'noopener'; });
  if (sources) renderSources(el, sources);
  const tools = el.querySelector('.tools');
  tools.innerHTML = `<button data-t="copy">⧉ Copy</button><button data-t="wa">WhatsApp</button><button data-t="speak">🔊 Read aloud</button>`;
  tools.onclick = (e) => {
    const t = e.target.dataset.t; if (!t) return;
    const plain = el.querySelector('.md').innerText;
    if (t === 'copy') { navigator.clipboard.writeText(plain); e.target.textContent = '✓ Copied'; setTimeout(() => (e.target.textContent = '⧉ Copy'), 1500); }
    if (t === 'wa') window.open('https://wa.me/?text=' + encodeURIComponent(plain), '_blank');
    if (t === 'speak') { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(plain); u.lang = 'en-IN'; speechSynthesis.speak(u); }
  };
}
function scrollEnd(smooth = true) { const s = $('#scroll'); s.scrollTo({ top: s.scrollHeight, behavior: smooth ? 'smooth' : 'auto' }); }
function nearBottom() { const s = $('#scroll'); return s.scrollHeight - s.scrollTop - s.clientHeight < 140; }

// ───────── Send / stream ─────────
function stopStream() { if (state.controller) state.controller.abort(); state.controller = null; setBusy(false); }
function setBusy(b) { state.busy = b; $('#sendBtn').innerHTML = b ? '■' : '➤'; $('#sendBtn').title = b ? 'Stop' : 'Send'; updateSend(); }
function updateSend() { $('#sendBtn').disabled = !state.busy && !$('#input').value.trim(); }

async function send(text) {
  text = (text || '').trim(); if (!text || state.busy) return;
  $('#hero').classList.add('hidden');
  $('#input').value = ''; autoGrow();
  addUser(text);
  const el = addBot(null);
  const mdEl = el.querySelector('.md');
  mdEl.innerHTML = '<div class="thinking"><span></span><span></span><span></span></div>';
  scrollEnd();
  setBusy(true);
  state.controller = new AbortController();
  let full = '', sources = [], started = false, error = null, raf = null;
  const paint = () => { raf = null; mdEl.innerHTML = md(full); mdEl.classList.add('cursor'); if (nearBottom()) scrollEnd(false); };
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text, chatId: state.current, style: state.style }), signal: state.controller.signal });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || `HTTP ${r.status}`); }
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!line.startsWith('data:')) continue;
        const ev = JSON.parse(line.slice(5));
        if (ev.chatId) { state.current = ev.chatId; location.hash = ev.chatId; }
        if (ev.sources) sources = ev.sources;
        if (ev.delta) { if (!started) { started = true; } full += ev.delta; if (!raf) raf = requestAnimationFrame(paint); }
        if (ev.error) error = ev.error;
      }
    }
  } catch (e) { if (e.name !== 'AbortError') error = e.message; }
  if (raf) cancelAnimationFrame(raf);
  if (error && !full) { mdEl.innerHTML = `<div class="error-msg">⚠️ ${esc(error)}</div>`; }
  else finishBot(el, full + (error ? `\n\n> ⚠️ ${error}` : ''), sources);
  state.controller = null; setBusy(false);
  await loadChats();
  const c = state.chats.find((x) => x.id === state.current); if (c) $('#chatTitle').textContent = c.title;
  // titles are generated in the background — refresh once more shortly
  setTimeout(async () => { await loadChats(); const c2 = state.chats.find((x) => x.id === state.current); if (c2) $('#chatTitle').textContent = c2.title; }, 2500);
}

// ───────── Composer ─────────
const input = $('#input');
function autoGrow() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 200) + 'px'; updateSend(); }
input.addEventListener('input', autoGrow);
input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value); } });
$('#sendBtn').onclick = () => state.busy ? stopStream() : send(input.value);
$('#chips').innerHTML = QUICK.map((c, i) => `<button class="chip" data-i="${i}"><span class="k">${c.k}</span><span class="d">${c.d}</span></button>`).join('');
$('#chips').onclick = (e) => { const b = e.target.closest('.chip'); if (b) send(QUICK[b.dataset.i].q); };
document.querySelectorAll('.mode button').forEach((b) => {
  b.classList.toggle('on', b.dataset.style === state.style);
  b.onclick = () => { state.style = b.dataset.style; localStorage.setItem('vb_style', state.style); document.querySelectorAll('.mode button').forEach((x) => x.classList.toggle('on', x === b)); };
});

// Voice input (Chrome / Edge / Android)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) $('#micBtn').classList.add('hidden');
else {
  let rec = null;
  $('#micBtn').onclick = () => {
    if (rec) { rec.stop(); return; }
    rec = new SR(); rec.lang = 'en-IN'; rec.interimResults = true;
    const base = input.value ? input.value + ' ' : '';
    rec.onresult = (e) => { input.value = base + [...e.results].map((r) => r[0].transcript).join(''); autoGrow(); };
    rec.onend = () => { rec = null; $('#micBtn').classList.remove('rec'); input.focus(); };
    $('#micBtn').classList.add('rec'); rec.start();
  };
}

// ───────── Modals ─────────
function modal(title, html) { $('#modalTitle').textContent = title; $('#modalBody').innerHTML = html; $('#modal').classList.remove('hidden'); }
$('#modalClose').onclick = () => { $('#modal').classList.add('hidden'); clearInterval(window._poll); };
$('#modal').onclick = (e) => { if (e.target.id === 'modal') $('#modalClose').onclick(); };
$('#libBtn').onclick = async () => {
  const items = await api('/api/library');
  modal('Sales library', items.length
    ? '<p style="color:var(--muted);margin-bottom:8px">One-pagers and sales files the copilot has read:</p>' + items.map((i) => `<div class="lib-item"><div>${esc(i.title)}<br><span>${i.source === 'drive' ? 'Google Drive' : 'knowledge folder'}</span></div>${i.url.startsWith('http') ? `<a href="${esc(i.url)}" target="_blank" rel="noopener">Open ↗</a>` : ''}</div>`).join('')
    : '<p>No sales files indexed yet. Set <code>GOOGLE_API_KEY</code> and run <code>npm run ingest</code>, or drop files into the <code>knowledge/</code> folder.</p>');
};
$('#adminBtn').onclick = async () => {
  const render = (s) => {
    const ix = s.index || {};
    $('#modalBody').innerHTML = `
      <div><span class="stat">Chunks: ${ix.chunks || 0}</span><span class="stat">Documents: ${ix.documents || 0}</span>
      ${Object.entries(ix.bySource || {}).map(([k, v]) => `<span class="stat">${k}: ${v}</span>`).join('')}</div>
      <p style="color:var(--muted);margin:8px 0">Last refresh: ${s.lastRun ? new Date(s.lastRun).toLocaleString() : 'never (this run)'} ${s.running ? '— <b style="color:var(--accent2)">running…</b>' : ''}</p>
      <div style="margin-top:10px">
        <button class="btn-sm" data-only="">Refresh everything</button>
        <button class="btn-sm" data-only="drive">Drive only</button>
        <button class="btn-sm" data-only="local">knowledge/ only</button>
        <button class="btn-sm" data-only="sites">Docs + website</button>
      </div>
      <div class="log">${esc((s.log || []).slice(-80).join('\n') || 'No log yet.')}</div>`;
    $('#modalBody').querySelectorAll('[data-only]').forEach((b) => b.onclick = async () => {
      await api('/api/admin/refresh', { method: 'POST', body: { only: b.dataset.only ? [b.dataset.only] : undefined } });
      poll();
    });
  };
  const poll = async () => { render(await api('/api/admin/status')); };
  modal('Knowledge refresh', 'Loading…'); await poll();
  clearInterval(window._poll); window._poll = setInterval(poll, 3000);
};

// start
boot().catch((e) => console.error(e));
</script>
</body>
</html>
